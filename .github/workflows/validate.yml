name: validate
on:
  workflow_call:
    inputs:
      N64RECOMP_COMMIT:
        type: string
        required: false
        default: 'a13e5cff96686776b0e03baf23923e3c1927b770'
    secrets:
      ZRE_REPO_WITH_PAT:
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: ubuntu-latest (x64, Linux)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive
      - name: Check ROM Build Availability
        id: rom-check
        env:
          ZRE_REPO_WITH_PAT: ${{ secrets.ZRE_REPO_WITH_PAT }}
        run: |
          if [ -n "$ZRE_REPO_WITH_PAT" ]; then
            echo "has_rom=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rom=false" >> "$GITHUB_OUTPUT"
          fi
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-latest-z64re-ccache-x64-${{ inputs.N64RECOMP_COMMIT }}
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld
      - name: Build Patches ELF
        run: |
          make -C patches CC=clang LD=ld.lld
      - name: Build and Run Settings Tests
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake -S . -B cmake-build-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DZELDA64_BUILD_TESTS_ONLY=ON \
            -DBUILD_TESTING=ON
          cmake --build cmake-build-tests --target Zelda64SettingsTests -j "$(nproc)"
          ctest --test-dir cmake-build-tests --output-on-failure
      - name: Install Full Build Dependencies
        if: steps.rom-check.outputs.has_rom == 'true'
        run: |
          sudo apt-get install -y libsdl2-dev libgtk-3-dev libfreetype6-dev
      - name: Prepare Build
        if: steps.rom-check.outputs.has_rom == 'true'
        env:
          ZRE_REPO_WITH_PAT: ${{ secrets.ZRE_REPO_WITH_PAT }}
        run: |
          git clone "$ZRE_REPO_WITH_PAT" zre
          ./zre/process.sh
          cp ./zre/mm_shader_cache.bin ./shadercache/
      - name: Build N64Recomp & RSPRecomp
        if: steps.rom-check.outputs.has_rom == 'true'
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout ${{ inputs.N64RECOMP_COMMIT }}
          git submodule update --init --recursive

          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target N64RecompCLI -j "$(nproc)"
          cmake --build cmake-build --config Release --target RSPRecomp -j "$(nproc)"

          cp cmake-build/N64Recomp ..
          cp cmake-build/RSPRecomp ..
      - name: Run N64Recomp & RSPRecomp
        if: steps.rom-check.outputs.has_rom == 'true'
        run: |
          ./N64Recomp us.rev1.toml
          ./RSPRecomp aspMain.us.rev1.toml
          ./RSPRecomp njpgdspMain.us.rev1.toml
      - name: Build ZeldaRecomp
        if: steps.rom-check.outputs.has_rom == 'true'
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -G Ninja -S . -B cmake-build \
            -DPATCHES_C_COMPILER=clang \
            -DPATCHES_LD=ld.lld
          cmake --build cmake-build --config Release --target Zelda64Recompiled -j "$(nproc)"
      - name: Prepare Archive
        if: steps.rom-check.outputs.has_rom == 'true'
        run: |
          mv cmake-build/Zelda64Recompiled Zelda64Recompiled
          rm -rf assets/scss
          tar -czf Zelda64Recompiled.tar.gz Zelda64Recompiled assets/ recompcontrollerdb.txt
      - name: Archive Zelda64Recomp
        if: steps.rom-check.outputs.has_rom == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zelda64Recompiled-Linux-X64-Release
          path: Zelda64Recompiled.tar.gz
